<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="{{ page.description | default: page.summary | default: site.description | strip_html | escape }}">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/blog-favicon.svg' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/blog.css' | relative_url }}">
</head>
<body>
  <a class="skip-link" href="#main-content">跳到正文</a>
  <header class="site-header">
    <a class="brand" href="{{ site.profile_url }}" aria-label="返回 Shengbo Sun 个人主页">
      <span class="brand-mark" aria-hidden="true">SB</span>
      <span class="brand-name">SHENGBO SUN<small>ENGINEERING NOTES</small></span>
    </a>
    <nav class="site-nav" aria-label="主导航">
      <a href="{{ site.profile_url }}">个人主页</a>
      <a href="{{ '/blog/' | relative_url }}" {% if page.url contains '/blog' or page.layout == 'post' %}aria-current="page"{% endif %}>文章</a>
    </nav>
  </header>
  <main id="main-content">{{ content }}</main>
  <footer class="site-footer">
    <span>SHENGBO SUN</span>
    <span>工程经验 · 技术难题 · 复盘记录</span>
  </footer>
  {% if page.layout == 'blog' %}<script src="{{ '/assets/js/blog.js' | relative_url }}" defer></script>{% endif %}
</body>
</html>
