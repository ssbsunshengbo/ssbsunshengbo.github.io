<!doctype html>
<html lang="zh-CN" data-color-mode="light" data-light-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="{{ page.description | default: page.summary | default: site.description | strip_html | escape }}">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/blog-favicon.svg' | relative_url }}">
  <link rel="preload" href="{{ '/assets/fonts/MonaSansVF.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ '/assets/css/vendor/primer/base-typography.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/vendor/primer/typography.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/vendor/primer/space.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/vendor/primer/light.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/blog.css' | relative_url }}">
</head>
<body>
  <a class="skip-link" href="#main-content">跳到正文</a>
  <header class="site-header">
    <div class="header-brand">
      <a class="brand" href="{{ site.profile_url }}">
        <span class="brand-name">Shengbo Sun</span>
        <span class="brand-divider" aria-hidden="true">/</span>
        <span class="brand-section">工程笔记</span>
      </a>
    </div>
    <form class="search-form" action="{{ '/blog/' | relative_url }}" method="get" role="search">
      <label class="visually-hidden" for="article-search">搜索文章</label>
      <svg aria-hidden="true" viewBox="0 0 16 16" width="16" height="16"><path fill="currentColor" d="M10.68 11.74a6.5 6.5 0 1 1 1.06-1.06l3.29 3.28a.75.75 0 1 1-1.06 1.06l-3.29-3.28ZM11.5 6.5a5 5 0 1 0-10 0 5 5 0 0 0 10 0Z"/></svg>
      <input id="article-search" type="search" name="q" autocomplete="off" placeholder="搜索文章" aria-label="搜索文章">
      <kbd>/</kbd>
    </form>
    <nav class="site-nav" aria-label="主导航">
      <a href="{{ site.profile_url }}">个人主页</a>
    </nav>
  </header>

  <nav class="breadcrumbs" aria-label="面包屑导航">
    <button class="sidebar-toggle" type="button" aria-label="折叠目录" aria-expanded="true" aria-controls="blog-sidebar">
      <svg aria-hidden="true" viewBox="0 0 16 16" width="16" height="16"><rect x="1.5" y="2" width="13" height="12" rx="1.5" fill="none" stroke="currentColor"/><path d="M5.25 2v12" fill="none" stroke="currentColor"/></svg>
    </button>
    <div class="breadcrumb-trail">
      <a href="{{ site.profile_url }}">首页</a>
      <span aria-hidden="true">/</span>
      <a href="{{ '/blog/' | relative_url }}">工程笔记</a>
      {% if page.layout == 'post' %}<span aria-hidden="true">/</span><span class="breadcrumb-current" aria-current="page">{{ page.title | escape }}</span>{% endif %}
    </div>
  </nav>

  <main id="main-content" class="docs-layout">
    <aside class="docs-sidebar" id="blog-sidebar" aria-label="博客导航">
      <h2 class="sidebar-title"><a href="{{ '/blog/' | relative_url }}">工程笔记</a></h2>
      <nav class="sidebar-nav">
        <a class="sidebar-link{% if page.layout == 'post' %} is-current{% endif %}" data-nav-all href="{{ '/blog/' | relative_url }}"{% if page.layout == 'post' %} aria-current="page"{% endif %}>全部文章</a>
        <div class="sidebar-group">
          <h3>分类</h3>
          <a class="sidebar-link sidebar-category" data-category-nav="工程实践" href="{{ '/blog/' | relative_url }}?category={{ '工程实践' | url_encode }}">工程实践</a>
          <a class="sidebar-link sidebar-category" data-category-nav="技术难题" href="{{ '/blog/' | relative_url }}?category={{ '技术难题' | url_encode }}">技术难题</a>
          <a class="sidebar-link sidebar-category" data-category-nav="AI实践" href="{{ '/blog/' | relative_url }}?category={{ 'AI实践' | url_encode }}">AI实践</a>
        </div>
      </nav>
    </aside>

    <div class="docs-content">{{ content }}</div>
  </main>

  <footer class="site-footer">
    <span>© {{ site.time | date: "%Y" }} Shengbo Sun</span>
    <a href="{{ site.profile_url }}">个人主页</a>
  </footer>
  <script src="{{ '/assets/js/docs.js' | relative_url }}" defer></script>
  {% if page.layout == 'blog' %}<script src="{{ '/assets/js/blog.js' | relative_url }}" defer></script>{% endif %}
</body>
</html>
