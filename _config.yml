title: Shengbo Sun · Engineering Notes
description: 工程实践、技术难题与 AI 实践（含 Agent 稳定性保障）。
url: https://ssbsunshengbo.github.io
baseurl: ""
profile_url: https://ssbsunshengbo.github.io/
permalink: /blog/:year/:month/:day/:title/
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - scripts
  - _site
  - .jekyll-cache
  - .sass-cache
  - vendor
  - .bundle
  - .gitignore
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
