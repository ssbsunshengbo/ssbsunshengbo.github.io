---
layout: default
editor: true
title: 写文章
description: 在浏览器中撰写、预览并保存工程笔记草稿。
permalink: /blog/write/
---
<header class="page-heading writer-page-heading">
  <h1>写文章</h1>
  <p>文章会自动保存在当前浏览器。完成后下载 Markdown，或复制到 GitHub 网页提交。</p>
</header>

<section class="writer" aria-label="文章编辑器">
  <div class="writer-draftbar">
    <label for="draft-select">草稿</label>
    <select id="draft-select" aria-label="选择草稿"></select>
    <button class="writer-button" id="new-draft" type="button">新建草稿</button>
    <button class="writer-text-button" id="delete-draft" type="button">删除</button>
    <span class="writer-save-status" id="save-status" role="status" aria-live="polite">保存在当前浏览器</span>
  </div>

  <div class="writer-fields">
    <label class="writer-field writer-title-field" for="post-title">标题
      <input id="post-title" type="text" maxlength="120" placeholder="例如：一次线上延迟问题的排查记录" autocomplete="off">
    </label>
    <label class="writer-field" for="post-slug">文章短网址
      <input id="post-slug" type="text" maxlength="80" placeholder="latency-investigation" autocomplete="off" spellcheck="false">
    </label>
    <label class="writer-field" for="post-date">发布日期
      <input id="post-date" type="date">
    </label>
    <label class="writer-field" for="post-category">分类
      <select id="post-category">
        <option>工程实践</option>
        <option>技术难题</option>
        <option>复盘记录</option>
      </select>
    </label>
    <label class="writer-field writer-summary-field" for="post-summary">摘要
      <input id="post-summary" type="text" maxlength="180" placeholder="用一两句话概括这篇文章。">
    </label>
    <label class="writer-field" for="post-tags">标签
      <input id="post-tags" type="text" placeholder="性能, Go, 排障">
    </label>
  </div>

  <div class="writer-publishbar">
    <div class="writer-publish-actions">
      <button class="writer-button" id="copy-markdown" type="button">复制 Markdown</button>
      <button class="writer-button" id="download-markdown" type="button">下载 .md</button>
      <a class="writer-button writer-primary" id="github-new-file" href="{{ site.repository_url }}/new/main" target="_blank" rel="noopener">在 GitHub 网页提交</a>
    </div>
    <p>文件名：<code id="post-filename">_posts/YYYY-MM-DD-article.md</code>。在 GitHub 新建此文件，粘贴复制的内容并提交即可发布。</p>
  </div>

  <div class="writer-editorbar">
    <h2>正文</h2>
    <div class="writer-view-tabs" role="group" aria-label="正文视图">
      <button type="button" id="edit-tab" aria-pressed="true">编辑</button>
      <button type="button" id="preview-tab" aria-pressed="false">预览</button>
    </div>
  </div>

  <div class="writer-columns" id="writer-columns">
    <section class="writer-pane writer-edit-pane" aria-labelledby="edit-heading">
      <h3 id="edit-heading">Markdown</h3>
      <textarea id="post-body" spellcheck="false" aria-label="Markdown 正文" placeholder="从问题背景、观察到的证据、方案取舍和最终结果开始记录。支持 Markdown 标题、列表、表格、引用和代码块。"></textarea>
    </section>
    <section class="writer-pane writer-preview-pane" aria-labelledby="preview-heading">
      <h3 id="preview-heading">预览</h3>
      <article class="writer-preview prose" id="writer-preview"></article>
    </section>
  </div>
</section>
